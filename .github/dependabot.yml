# Dependency updates. Security updates are enabled separately in the repository settings; this file
# adds routine version bumps so the toolchain does not silently age.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR per week for all minor/patch bumps instead of a dozen — each still runs `check`.
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # The tracker core is pinned deliberately: bumping it is a lockstep change with the positional
      # config orders in src/config/coreParams.ts (see scripts/check-core-params.mjs) and must be a
      # reviewed commit, not an automated PR.
      - dependency-name: "@dmarket/p2p-tracker-core"
