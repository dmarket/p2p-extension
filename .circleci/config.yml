version: 2.1

# CI/CD for the DMarket Trade Tracker browser extension (WXT + Preact, Chrome MV3).
#
# WHAT RUNS ON EVERY PUSH
#   - check       : `npm run compile` (tsc + the three guard scripts), `npm run lint`, `npm test`.
#   - build-prod  : production zip   -> .output/chrome-mv3      (no debug console)
#   - build-debug : development zip  -> .output/chrome-mv3-dev  (debug console included)
#   `check` GATES both builds; the two builds then run in parallel with each other (the reasoning is at
#   the `ci` workflow). Both zips are downloadable from the job's Artifacts tab and are meant to be
#   installed by hand: unzip, then chrome://extensions -> Developer mode -> Load unpacked.
#
# RELEASE MODEL — releases come from a `release/vX.Y.Z` BRANCH; a human approves them.
#   Branch off as `release/v1.0.1`, bump `version` in package.json to the SAME version, add the
#   matching `## [x.y.z]` section to CHANGELOG.md, push, then approve `hold_release` in the CircleCI
#   UI. Only then does `release` tag `v<version>` (on that branch's commit) and publish a GitHub
#   Release. WXT derives the manifest version from package.json, so that field is the single source of
#   truth — and the branch name must agree with it, or `release` fails before tagging anything.
#
#   WHY A BRANCH AND NOT `main`: releasing is a deliberate, named act, and the branch is where it is
#   declared. It also makes the approval meaningful — the hold now appears only on branches whose
#   whole purpose is to release, instead of on every push to `main` (the majority of which released
#   nothing and still parked a workflow "On Hold" forever). `main` keeps running `check` and both
#   builds, it just cannot release.
#
#   The release commit still has to reach `main` afterwards — merge the release branch back, or `main`
#   drifts from what was published. Nothing in CI enforces that; it is an operator step.
#
#   THREE things make a push a non-release, all of them clean skips rather than failures:
#     - the tag for that version already exists (i.e. the version was not bumped);
#     - `[skip release]` (case-insensitive) in the commit message — checks and builds still run;
#       contrast with CircleCI's own `[skip ci]`, which skips the entire pipeline;
#     - the build was made against a `-SNAPSHOT` core. package.json pins an exact core version, so
#       this does not happen by drift — but `npm run core:latest` deliberately moves onto the newest
#       snapshot for development, and a snapshot can be unpublished from npm, which would make a
#       published build unreproducible. This is the extension's equivalent of the core repo's rule
#       that a `-SNAPSHOT` version is never tagged and gets no GitHub Release. Releasing therefore
#       requires the pin to be back on a stable core version.
#
#   WHAT IS PUBLISHED: the production zip, its sourcemaps archive, the production manifest and
#   SHA256SUMS. NOT the debug zip — it is not what ships, and it inlines internal hostnames; it stays
#   in the `build-debug` job's Artifacts tab.
#
# STORE DEPLOY — a separate pipeline, triggered by the tag the release job pushes:
#     tag v*  ->  pack_crx  ->  store_preflight  ->  hold_store_upload (approval)  ->  upload_to_store
#   The first two run unattended. `pack_crx` downloads the production zip from that tag's GitHub
#   Release, re-verifies it, wraps it UNCHANGED in a CRX3 signed with our own RSA key, and attaches the
#   .crx to the Release. `store_preflight` then REHEARSES the upload against the live store — read-only,
#   it cannot upload — so whoever clicks Approve already knows what is published today and whether this
#   version would be accepted. `upload_to_store` sends the .crx and submits it for review.
#
#   The rehearsal is a job and not a `CWS_DRY_RUN` variable on purpose. A variable in project settings
#   is STATE: it applies to every later run until someone remembers to remove it, so a forgotten flag
#   silently stops releases from reaching the store while the log says "DRY RUN". As a job it is
#   stateless, it happens on every release without anyone arranging it, and it lands before the
#   decision instead of replacing it. Nothing uploads without the click either way.
#
#   The pipeline lives in its own workflow ON PURPOSE: an approval job inside `ci` would leave every
#   push sitting "On Hold" forever, including the majority that release nothing.
#
#   WHY A SIGNED CRX AND NOT THE ZIP: the store item is opted into **Verified CRX Uploads** (dashboard
#   -> Package), so every package update must be a CRX3 signed with the key whose public half is
#   registered there — the dashboard and the API both reject a plain zip ("You must update your item
#   with a crx package"). That is what protects the item from a malicious update if the Google account
#   is ever compromised. Opting out is a Chrome Web Store support ticket, not a setting.
#
#   VERSION POLICY — every release consumes one NUMERIC version, beta or not:
#
#       1.0.1-beta  ->  1.0.2-beta  ->  1.0.3  ->  1.1.0-beta  ->  1.1.1
#
#   Betas here are ordinary PUBLIC releases that ship to every store user; the `-beta` suffix is a
#   label so users hold the right expectations, not a channel. (The store has no beta channel to use
#   even if we wanted one: API v2's DistributionChannel carries only deployPercentage and crxVersion,
#   and staged rollout by percentage needs 10k+ weekly users.)
#
#   Which is why the SemVer habit of `1.1.0-beta.1 -> 1.1.0-beta.2 -> 1.1.0` does NOT work: the store
#   compares `manifest.version`, and WXT has already dropped the suffix by then, so all three are
#   manifest 1.1.0 and only the first could ever be uploaded. Bumping a suffix is not a version bump
#   as far as the store is concerned. A counter inside the suffix (`-beta.2`) is therefore misleading
#   and better left off — the numbers already count the releases.
#
#   `upload_to_store`'s preflight refuses a non-increasing version (exit 3) before uploading anything,
#   and says this in its output.
#
# ENVIRONMENT — no .env file is ever written in CI. Vite folds `process.env` keys matching its
#   envPrefix (WXT sets `['VITE_','WXT_']`) into `import.meta.env`, taking precedence over .env
#   files, and wxt.config.ts's manifest hooks read `process.env.WXT_*` directly. So plain context
#   variables are enough.
#
#   context `p2p-extension-ci`      -> build jobs only. WXT_COLLECTOR_URL, WXT_FIREBASE_API_KEY,
#     WXT_FIREBASE_PROJECT_ID, WXT_FIREBASE_APP_ID (production build: these derive two host
#     permissions that MUST be in the first published build), plus WXT_DEV_*/WXT_STAGE_* so the debug
#     artifact points at the internal endpoints. `check` deliberately gets NO context — the suite is
#     env-independent (every env-sensitive test pins its own value with vi.stubEnv), and the job that
#     runs the most code should hold the fewest secrets.
#   context `org-global`            -> release + deploy only. Supplies GITHUB_TOKEN. This is the
#     org-wide context the dmarket org already maintains for every repo (per @dmytro.tkachuk,
#     2026-09-02), which is why there is no project-scoped release context: a second GITHUB_TOKEN
#     would be a second thing to rotate. Two consequences worth knowing.
#     - It is SHARED and BROAD: any job in any project of the org can read it, and the token is not
#       scoped to this repository the way a fine-grained PAT would be. Nothing here can narrow that;
#       it is the org's credential, not ours.
#     - It is NOT verified to carry `contents: write` on dmarket/p2p-extension. If it does not, the
#       first `release` run fails at the tag push and `scripts/ci/release.sh` prints which of the
#       four causes it is (see `diagnose_push_denied` there) — read that output before asking anyone
#       for a new token.
#   PROJECT-LEVEL env vars (Project Settings -> Environment Variables) -> the store-deploy secrets:
#     CRX_SIGNING_KEY_B64 (base64 of the RSA private key registered under Verified CRX Uploads) and
#     CHROME_EXTENSION_ID / CHROME_PUBLISHER_ID / CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL /
#     CHROME_SERVICE_ACCOUNT_PRIVATE_KEY. Five variables, and deliberately no CWS_* switches: the
#     upload's behaviour switches are CLI flags on the job's own command, not project state.
#
#     ACCEPTED TRADE-OFF (decided 2026-09-07), not the intended design. Two project-scoped CONTEXTS
#     belong here — `pack_crx` holding only the signing key, `upload_to_store` only the store
#     credentials — so that neither job can do the other's damage. Creating a context needs CircleCI
#     ORGANIZATION rights, which nobody on this project has, so the five variables sit at project
#     level, where CircleCI exposes them to EVERY job in the project, `check` and both builds included.
#
#     Why that was judged acceptable here: this CircleCI project is private and stays private, so
#     there are no pull-request builds from outside the org — which is the ordinary way project-wide
#     secrets get exfiltrated.
#
#     What privacy does NOT cover, i.e. the residual risk: `check` and the builds run `npm ci`, so a
#     compromised dependency's postinstall script would execute with both secrets in its environment.
#     package-lock.json is pinned, so this needs a malicious version to be MERGED here (a dependency
#     bump), not merely published upstream — a visible event, not a silent one.
#
#     If it ever happens, or as soon as someone has the org rights: rotate the service-account key
#     (minutes, in Google Cloud) and the signing key (Chrome Web Store support, up to a week), create
#     `p2p-extension-crx-signing` + `p2p-extension-store`, move the variables, and put the `context:`
#     lines back on the two jobs in `production_deploy`.
#
# WHERE THE SHELL LIVES — `scripts/ci/*.sh`, not inline here, and that is not a style preference:
#   - CircleCI caps a single config expression at **2048 characters** and REJECTS the whole config
#     otherwise ("Expressions must be less than 2048 characters"). The release job's publish step was
#     3951 and the deploy stub 2479, so this config was unprocessable until they moved out.
#   - A YAML block scalar re-indents heredoc bodies and hides quoting bugs that only surface at run
#     time (two were found this way: a multibyte ellipsis folded into a `$VAR` name, and backticks in
#     an unquoted heredoc executing `wxt submit`).
#   - A real file can be run and reviewed as shell: `bash scripts/ci/release.sh guard` standalone.
# Keep the steps here one-liners. If a step needs more than a command, it belongs in scripts/ci/.
#
# GOTCHA: never run `npm run core:latest` here, and never add it back to `build:debug`. It installs
# the newest `snapshot` core over the exact pin in package.json, which breaks lockfile determinism,
# can drift the installed core out of step with the `check-core-params` guard, and would make every
# CI build's provenance depend on whatever was published that minute. CI builds only what the
# lockfile says: `npx wxt zip --mode <mode>`.

executors:
  node:
    docker:
      # wxt declares engines.node >= 22; vite wants ^20.19 || >=22.12. Same image family as the core
      # repo's publish job.
      - image: cimg/node:24.18
    resource_class: medium
    environment:
      REPO_SLUG: dmarket/p2p-extension

commands:
  install_deps:
    description: >
      Restore the npm cache, install from the lockfile, save the cache. `npm ci` also runs the
      `postinstall` hook (`wxt prepare`), which generates .wxt/tsconfig.json — tsconfig.json extends
      it, so nothing type-checks without this. The npm cache is cached rather than node_modules
      (161 MB, mostly small files): `npm ci` wipes node_modules anyway.
    steps:
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

jobs:
  check:
    executor: node
    steps:
      - checkout
      - install_deps
      # `when: always` on the later steps so one red run reports every failure, not just the first.
      - run:
          name: Type-check + guards (tsc, core params, surface priority, create-trade cause)
          command: npm run compile
      - run:
          name: Lint
          when: always
          command: npm run lint
      - run:
          name: Unit tests
          when: always
          command: npm test
      # No `when:` on these two, and none is needed: store steps run even when an earlier step failed,
      # which is the case they exist for. They read test-results/junit.xml, which vitest.config.ts
      # writes unconditionally — if it is ever missing, CircleCI reports "an issue with the output"
      # and the real cause is upstream (the tests never ran), not the report.
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results
          destination: test-results

  build:
    executor: node
    parameters:
      mode:
        description: WXT build mode. `production` strips the debug console; `development` includes it.
        type: enum
        enum: [production, development]
      outdir:
        description: >
          Where WXT writes this mode's build. Declared next to the mode rather than derived in shell so
          the verify step stays a one-liner. If the two ever disagree the verify step says so loudly
          (a development directory checked as production fails six ways), so this cannot drift silently.
        type: string
    steps:
      - checkout
      - install_deps
      - run:
          name: Build and zip (<< parameters.mode >>)
          # `wxt zip` builds first and then zips the output directory, so the `build:done` hook that
          # copies the ~10 MB TLSN prover (pkg/, transport/) into the output is inside the zip.
          command: npx wxt zip --mode << parameters.mode >>
      - run:
          name: Verify the artifact (<< parameters.mode >>)
          command: node scripts/verify-build.mjs << parameters.outdir >> --mode << parameters.mode >>
      - run:
          name: Collect artifacts
          command: bash scripts/ci/collect-artifacts.sh << parameters.mode >>
      - store_artifacts:
          path: artifacts
      - persist_to_workspace:
          root: .
          paths:
            - artifacts

  release:
    executor: node
    steps:
      # No install_deps: this job needs node, git and curl only. scripts/verify-build.mjs has no
      # dependencies for exactly this reason.
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Resolve the version and decide whether this is a release
          command: bash scripts/ci/release.sh resolve
      - run:
          name: Guard — CHANGELOG section and the production privilege surface
          command: bash scripts/ci/release.sh guard
      - run:
          name: Tag
          command: bash scripts/ci/release.sh tag
      - run:
          name: GitHub Release + assets
          command: bash scripts/ci/release.sh publish

  # Signs the released zip into a CRX3. No approval: this is the artifact step. Runs `npm ci`-free like
  # `release` — scripts/ci/pack-crx.mjs and verify-build.mjs have no dependencies precisely so these
  # jobs stay node + curl + coreutils, which also means no third-party code runs next to the signing
  # key HERE (the exposure is in `check`/`build-*`, which do install — see the env note in the header).
  pack_crx:
    executor: node
    steps:
      - checkout
      - run:
          name: Fetch the released package
          command: bash scripts/ci/pack-crx.sh fetch
      - run:
          name: Verify the package before signing it
          command: bash scripts/ci/pack-crx.sh verify
      - run:
          name: Sign it into a CRX3
          command: bash scripts/ci/pack-crx.sh pack
      - run:
          name: Attach the .crx to the GitHub Release
          command: bash scripts/ci/pack-crx.sh attach
      - store_artifacts:
          path: artifacts/store
      - persist_to_workspace:
          root: .
          paths:
            - artifacts/store

  # Rehearses the upload against the live store, read-only, before anyone is asked to approve one.
  # Same job body as the real upload minus the writes, so a wrong id, a service account that was never
  # added under Developer Dashboard -> Account, or a version the store would reject fails HERE — rather
  # than after an approval, on a release that could not have worked.
  store_preflight:
    executor: node
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Rehearse the upload (read-only — nothing is sent)
          command: bash scripts/ci/upload-to-store.sh preflight

  # Uploads that .crx to the Chrome Web Store and submits it for review. Runs only after a human
  # approves. Gets the package through the workspace — workspaces survive an approval job — so it needs
  # no GITHUB_TOKEN of its own.
  upload_to_store:
    executor: node
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Upload and submit for review
          command: bash scripts/ci/upload-to-store.sh upload

workflows:
  ci:
    jobs:
      - check
      # The two builds run in parallel with EACH OTHER, but both wait for `check`.
      #
      # Not an optimisation traded away lightly — gating costs roughly a minute of wall clock per push
      # (locally, warm: compile 3s + lint 6s + test 1s against an 8s build; on CI both jobs are
      # dominated by `npm ci` and the build additionally copies the ~10 MB prover). It buys two things:
      #   - No installable artifact ever exists on a pipeline whose own checks failed. These zips exist
      #     to be handed to a human and loaded unpacked, so one that came from a red pipeline is a trap.
      #   - Specifically `check-core-params`: when that guard fails, the extension's positional config
      #     orders disagree with the installed core, and the bundle a build would produce carries a
      #     CORRUPTED config (a cookie name written into a regex slot, a trust anchor into a read
      #     definition). `verify-build.mjs` cannot catch that — it checks the manifest and the payload,
      #     not config slots — so the artifact would look perfectly valid and behave wrongly.
      - build:
          name: build-prod
          mode: production
          outdir: .output/chrome-mv3
          requires:
            - check
          context:
            - p2p-extension-ci
      - build:
          name: build-debug
          mode: development
          outdir: .output/chrome-mv3-dev
          requires:
            - check
          context:
            - p2p-extension-ci
      # Releasing is a manual act. Nothing is tagged or published until someone approves this, so a
      # push to a release branch is a proposal, not a publication.
      #
      # Scoped to `release/vX.Y.Z` branches, which is what keeps this approval meaningful: it appears
      # only where releasing is the point. A push to such a branch that releases nothing anyway (the
      # tag already exists, `[skip release]`, or a snapshot core) is still safe to approve — `release`
      # prints why and goes green.
      #
      # Deliberately NOT waiting for `build-debug`: only the production build is published, so a broken
      # debug build must not block a release. `check` is transitively required through `build-prod`;
      # listed anyway so removing a build's gate cannot quietly make a release possible on a red check.
      - hold_release:
          type: approval
          requires:
            - check
            - build-prod
          filters: &release_branches
            branches:
              # `release/v1.0.1`, and a prerelease suffix is allowed (`release/v1.1.0-beta.1`).
              # scripts/ci/release.sh then requires package.json's version to be exactly this string.
              only: /^release\/v\d+(\.\d+){0,3}(-[0-9A-Za-z.-]+)?$/
      - release:
          requires:
            - hold_release
          context:
            - org-global
          filters: *release_branches

  # Triggered by the tag the `release` job pushes. Jobs in `ci` carry no tag filter, so they are not
  # re-run by that push. If tag pipelines turn out to be disabled for this project, move these three
  # jobs into `ci` behind `requires: [release]` and have them exit early when RELEASE=false — at the
  # cost of an "On Hold" workflow on every push to main.
  #
  # The tag pattern accepts an optional SemVer prerelease suffix (`v1.0.0-beta.1`). It has to: the tag
  # is `v` + package.json's version, and WXT supports a prerelease version by splitting it across
  # `manifest.version` / `version_name`. A numbers-only pattern would silently never match a beta tag,
  # so this deploy gate would simply not appear — the quietest possible failure.
  production_deploy:
    jobs:
      - pack_crx:
          context:
            - org-global
          filters: &tag_only
            tags:
              only: /^v\d+(\.\d+){0,3}(-[0-9A-Za-z.-]+)?$/
            branches:
              ignore: /.*/
      - store_preflight:
          requires:
            - pack_crx
          filters: *tag_only
      # The one human decision on this path: everything before it is reproducible from the tag, and
      # everything after it is visible to users. `store_preflight` has already established that the
      # store would accept this exact package, so the decision is whether to release it — not whether
      # it would work.
      - hold_store_upload:
          type: approval
          requires:
            - store_preflight
          filters: *tag_only
      - upload_to_store:
          requires:
            - hold_store_upload
          filters: *tag_only
