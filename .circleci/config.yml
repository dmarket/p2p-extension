version: 2.1

# CI/CD for the DMarket Trade Tracker browser extension (WXT + Preact, Chrome MV3).
#
# WHAT RUNS ON EVERY PUSH
#   - check       : `npm run compile` (tsc + the three guard scripts), `npm run lint`, `npm test`.
#   - build-prod  : production zip   -> .output/chrome-mv3      (no debug console)
#   - build-debug : development zip  -> .output/chrome-mv3-dev  (debug console included)
#   `check` GATES both builds; the two builds then run in parallel with each other (the reasoning is at
#   the `ci` workflow). Both zips are downloadable from the job's Artifacts tab and are meant to be
#   installed by hand: unzip, then chrome://extensions -> Developer mode -> Load unpacked.
#   - publish_debug_build (`main` only, after a green build-debug): uploads the debug zip over the QA
#     autotests' `latest.zip` in a stage Cloud Storage bucket (scripts/ci/publish-debug-build.mjs).
#     The tests download it with their own credentials and install it into Chrome. Always overwrites;
#     the last build to finish is `latest`. The target is the project env var DEBUG_BUILD_GCS_URI
#     (gs://<bucket>/<object>), kept out of this public repo like the other stage bucket names.
#
# RELEASE MODEL — releases come from a `release/vX.Y.Z` BRANCH; a human approves them.
#   Land the `version` bump in package.json and the matching `## [x.y.z]` section of CHANGELOG.md on
#   `main` (a normal pull request), branch off it as `release/v1.0.1` with the SAME version, push, then
#   approve `hold_release` in the CircleCI UI. Only then does `release` tag `v<version>` (on that
#   branch's commit) and publish a GitHub Release. WXT derives the manifest version from package.json, so that field is the single source of
#   truth — and the branch name must agree with it, or `release` fails before tagging anything.
#
#   WHY A BRANCH AND NOT `main`: releasing is a deliberate, named act, and the branch is where it is
#   declared. It also makes the approval meaningful — the hold now appears only on branches whose
#   whole purpose is to release, instead of on every push to `main` (the majority of which released
#   nothing and still parked a workflow "On Hold" forever). `main` keeps running `check` and both
#   builds, it just cannot release.
#
#   `hold_release` is the ONLY approval on the path: after it the release is tagged, packaged and
#   submitted to the Chrome Web Store unattended, and `delete_release_branch` then deletes the branch
#   (scripts/ci/delete-release-branch.sh). The branch is never merged back — it carries nothing `main`
#   lacks, because the bump went through `main` first — and the released commit stays reachable from
#   its tag. A branch whose push released nothing is kept.
#
#   THREE things make a push a non-release, all of them clean skips rather than failures:
#     - the tag for that version already exists (i.e. the version was not bumped);
#     - `[skip release]` (case-insensitive) in the commit message — checks and builds still run;
#       contrast with CircleCI's own `[skip ci]`, which skips the entire pipeline;
#     - the build was made against a `-SNAPSHOT` core. package.json pins an exact core version, so
#       this does not happen by drift — but `npm run core:latest` deliberately moves onto the newest
#       snapshot for development, and a snapshot can be unpublished from npm, which would make a
#       published build unreproducible. This is the extension's equivalent of the core repo's rule
#       that a `-SNAPSHOT` version is never tagged and gets no GitHub Release. Releasing therefore
#       requires the pin to be back on a stable core version.
#
#   WHAT IS PUBLISHED: the production zip, its sourcemaps archive, the production manifest and
#   SHA256SUMS. NOT the debug zip — it is not what ships, and it inlines internal hostnames; it stays
#   in the `build-debug` job's Artifacts tab and, from `main`, in the private stage bucket the QA
#   autotests read (`publish_debug_build`). Never anywhere public.
#
# STORE DEPLOY — the rest of the same release pipeline, after the tag:
#     release  ->  pack_crx  ->  store_preflight  ->  upload_to_store  ->  delete_release_branch
#   All of it runs unattended once `hold_release` is approved. `pack_crx` downloads the production zip
#   from that tag's GitHub Release, re-verifies it, wraps it UNCHANGED in a CRX3 signed with our own RSA key, and attaches the
#   .crx to the Release. `store_preflight` then REHEARSES the upload against the live store — read-only,
#   it cannot upload — so a wrong id, a missing service account or a version the store would refuse
#   fails before any write. `upload_to_store` sends the .crx and submits it for review.
#
#   The rehearsal is a job and not a `CWS_DRY_RUN` variable on purpose. A variable in project settings
#   is STATE: it applies to every later run until someone remembers to remove it, so a forgotten flag
#   silently stops releases from reaching the store while the log says "DRY RUN". As a job it is
#   stateless, it happens on every release without anyone arranging it, and it lands before the
#   write instead of replacing it.
#
#   The approval sits inside `ci` without leaving every push "On Hold": like every job after it, it
#   carries the release-branch filter, so `main` and feature branches never see it.
#
#   WHY A SIGNED CRX AND NOT THE ZIP: the store item is opted into **Verified CRX Uploads** (dashboard
#   -> Package), so every package update must be a CRX3 signed with the key whose public half is
#   registered there — the dashboard and the API both reject a plain zip ("You must update your item
#   with a crx package"). That is what protects the item from a malicious update if the Google account
#   is ever compromised. Opting out is a Chrome Web Store support ticket, not a setting.
#
#   VERSION POLICY — every release consumes one NUMERIC version, beta or not:
#
#       1.0.1-beta  ->  1.0.2-beta  ->  1.0.3  ->  1.1.0-beta  ->  1.1.1
#
#   Betas here are ordinary PUBLIC releases that ship to every store user; the `-beta` suffix is a
#   label so users hold the right expectations, not a channel. (The store has no beta channel to use
#   even if we wanted one: API v2's DistributionChannel carries only deployPercentage and crxVersion,
#   and staged rollout by percentage needs 10k+ weekly users.)
#
#   Which is why the SemVer habit of `1.1.0-beta.1 -> 1.1.0-beta.2 -> 1.1.0` does NOT work: the store
#   compares `manifest.version`, and WXT has already dropped the suffix by then, so all three are
#   manifest 1.1.0 and only the first could ever be uploaded. Bumping a suffix is not a version bump
#   as far as the store is concerned. A counter inside the suffix (`-beta.2`) is therefore misleading
#   and better left off — the numbers already count the releases.
#
#   `upload_to_store`'s preflight refuses a non-increasing version (exit 3) before uploading anything,
#   and says this in its output.
#
# STORE WATCH + FORCED UPDATE (scripts/ci/force-update.sh).
#   Every release that reaches `upload_to_store` gets `watch_store_release`, which creates a CircleCI schedule
#   `store-release-<version>` through API v2 — every 30 min on `main`, the version, a 45-day deadline and this
#   release's workflow id as pipeline parameters — and nothing else, because store review takes anywhere from
#   hours to a month.
#
#   That schedule runs `store_watch`. Once Chrome's update server serves the version it starts ONE
#   `store_release` pipeline through the API and DELETES ITS OWN SCHEDULE. That pipeline runs two jobs in
#   parallel: `notify_store_release` (the "live in the Chrome Web Store" notice in the release channel, always)
#   and `raise_min_version` (only when the release was forced). A schedule still waiting at its deadline starts
#   the same pipeline with outcome `expired` (a warning notice, no raise), deletes itself and fails loudly.
#   Waiting for the update server is what makes the extension's single `requestUpdateCheck()` find the update
#   instead of being throttled for ~5 h — and it is when users actually get the release.
#
#   FORCING is decided HERE, in the release pipeline, by `hold_force_update`, and nowhere else: the deferred
#   pipelines only read that approval's state through the API. The minimum is raised once the version is served
#   AND the approval is given, by whichever happens second — `raise_min_version` when the approval came first,
#   `approve_force_update` when the store was faster than the approver. Both are idempotent.
#
#   Leaving `hold_force_update` unapproved is the normal "not forced" answer; the release pipeline then stays
#   "On Hold" rather than green, and that is the only cost. Neither `watch_store_release` nor
#   `approve_force_update` checks the release branch out — `delete_release_branch` may already have removed
#   it — they clone `main` instead.
#
#   Project env vars: CIRCLE_API_TOKEN (a CircleCI PERSONAL token — API v2 accepts no project token; it
#   expires within a year and dies with its owner's access; the pipelines it starts run as its owner) and
#   P2P_EXTENSION_DEPLOY_SA_KEY (set by devops: base64 of a service-account JSON key scoped to
#   p2p/extension-config.json and to the debug-build prefix `publish_debug_build` writes; scripts/ci/gcs.mjs
#   signs with it, no gcloud needed). Pushing to `main` uses org-global's GITHUB_TOKEN, whose owner is an admin and bypasses the
#   rulesets. Slack goes through the `circleci/slack` orb with the org context `dm-release-notify`
#   (SLACK_ACCESS_TOKEN + SLACK_DEFAULT_CHANNEL) — the same bot, channel and message shape as every backend
#   "deployed to prod" notice (see `release_notice`).
#
# ENVIRONMENT — no .env file is ever written in CI. Vite folds `process.env` keys matching its
#   envPrefix (WXT sets `['VITE_','WXT_']`) into `import.meta.env`, taking precedence over .env
#   files, and wxt.config.ts's manifest hooks read `process.env.WXT_*` directly. So plain context
#   variables are enough.
#
#   context `p2p-extension-ci`      -> build jobs only. WXT_COLLECTOR_URL (production build: it derives
#     a host permission that MUST be in the first published build), plus WXT_DEV_*/WXT_STAGE_* so the debug
#     artifact points at the internal endpoints. `check` deliberately gets NO context — the suite is
#     env-independent (every env-sensitive test pins its own value with vi.stubEnv), and the job that
#     runs the most code should hold the fewest secrets.
#   context `org-global`            -> release + deploy only. Supplies GITHUB_TOKEN. This is the
#     org-wide context the dmarket org already maintains for every repo (per @dmytro.tkachuk,
#     2026-09-02), which is why there is no project-scoped release context: a second GITHUB_TOKEN
#     would be a second thing to rotate. Two consequences worth knowing.
#     - It is SHARED and BROAD: any job in any project of the org can read it, and the token is not
#       scoped to this repository the way a fine-grained PAT would be. Nothing here can narrow that;
#       it is the org's credential, not ours.
#     - It is NOT verified to carry `contents: write` on dmarket/p2p-extension. If it does not, the
#       first `release` run fails at the tag push and `scripts/ci/release.sh` prints which of the
#       four causes it is (see `diagnose_push_denied` there) — read that output before asking anyone
#       for a new token.
#   PROJECT-LEVEL env vars (Project Settings -> Environment Variables) -> the store-deploy secrets:
#     CRX_SIGNING_KEY_B64 (base64 of the RSA private key registered under Verified CRX Uploads) and
#     CHROME_EXTENSION_ID / CHROME_PUBLISHER_ID / CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL /
#     CHROME_SERVICE_ACCOUNT_PRIVATE_KEY. Five variables, and deliberately no CWS_* switches: the
#     upload's behaviour switches are CLI flags on the job's own command, not project state.
#
#     ACCEPTED TRADE-OFF (decided 2026-09-07), not the intended design. Two project-scoped CONTEXTS
#     belong here — `pack_crx` holding only the signing key, `upload_to_store` only the store
#     credentials — so that neither job can do the other's damage. Creating a context needs CircleCI
#     ORGANIZATION rights, which nobody on this project has, so the five variables sit at project
#     level, where CircleCI exposes them to EVERY job in the project, `check` and both builds included.
#
#     Why that was judged acceptable here: the CircleCI project is private and stays private (an
#     anonymous request for the badge or the v1.1/v2 API gets 404), so nobody outside can read a build.
#     What keeps an OUTSIDER from running one is a different control, and it is the one to check in the
#     dashboard rather than assume: Project Settings -> Advanced, "Build forked pull requests" and
#     "Pass secrets to builds from forked pull requests". Both default off; both must stay off while
#     these variables are project-level. The repo is public and forkable, so that is not academic.
#
#     What privacy does NOT cover, i.e. the residual risk — and it is not the postinstall story this
#     comment used to tell. `check` and both builds carry NO branch filter (only the six release jobs
#     do), so every push runs them with all five secrets in scope. Dependabot branches live in this
#     repo, not in a fork, so its weekly PRs get the same environment: third-party code executes here
#     BEFORE review and BEFORE any merge. `allowScripts` in package.json narrows `npm ci` to esbuild +
#     fsevents, but that is the smaller half — vitest, eslint, vite and wxt all IMPORT dependency code
#     and run it.
#
#     Weigh it honestly in the other direction too: a dependency that runs in `build-prod` can poison
#     the artifact itself, and that artifact is signed and shipped regardless of who holds the key. So
#     splitting these secrets does not prevent the worst outcome; it denies out-of-band publishing
#     (signing an arbitrary CRX, uploading past the pipeline and past the human approval) and denies
#     persistence once the bad dependency is gone.
#
#     Cheapest real mitigation short of contexts, needing nobody's permission: `unset` the store and
#     signing variables into $BASH_ENV as the first step of `check` and both builds — the same
#     mechanism `scripts/ci/release.sh` already uses to export across steps.
#
#     If it ever happens, or as soon as someone has the org rights: rotate the service-account key
#     (minutes, in Google Cloud) and the signing key (Chrome Web Store support, up to a week), create
#     `p2p-extension-crx-signing` + `p2p-extension-store`, move the variables, and put the `context:`
#     lines back on the store jobs (`pack_crx` … `upload_to_store`).
#
# WHERE THE SHELL LIVES — `scripts/ci/*.sh`, not inline here, and that is not a style preference:
#   - CircleCI caps a single config expression at **2048 characters** and REJECTS the whole config
#     otherwise ("Expressions must be less than 2048 characters"). The release job's publish step was
#     3951 and the deploy stub 2479, so this config was unprocessable until they moved out.
#   - A YAML block scalar re-indents heredoc bodies and hides quoting bugs that only surface at run
#     time (two were found this way: a multibyte ellipsis folded into a `$VAR` name, and backticks in
#     an unquoted heredoc executing `wxt submit`).
#   - A real file can be run and reviewed as shell: `bash scripts/ci/release.sh guard` standalone.
# Keep the steps here one-liners. If a step needs more than a command, it belongs in scripts/ci/.
#
# GOTCHA: never run `npm run core:latest` here, and never add it back to `build:debug`. It installs
# the newest `snapshot` core over the exact pin in package.json, which breaks lockfile determinism,
# can drift the installed core out of step with the `check-core-params` guard, and would make every
# CI build's provenance depend on whatever was published that minute. CI builds only what the
# lockfile says: `npx wxt zip --mode <mode>`.

# Set only by a `store-release-<version>` schedule (scripts/ci/force-update.mjs `scheduleBody`) and by the
# `store_release` pipeline it starts (`storeReleaseParameters`); empty on every other pipeline, which is what keeps
# `store_watch` and `store_release` from running anywhere else.
parameters:
  store_watch_version:
    type: string
    default: ''
  store_watch_until:
    type: string
    default: ''
  release_workflow_id:
    type: string
    default: ''
  release_label:
    type: string
    default: ''
  release_sha:
    type: string
    default: ''
  release_actor:
    type: string
    default: ''
  # `store_release` only.
  store_release_outcome:
    type: enum
    enum: ['', served, expired]
    default: ''
  store_served_version:
    type: string
    default: ''
  force_update:
    type: boolean
    default: false

orbs:
  # The same orb and version the backend repos use for their release-channel notices (dmarket/p2p,
  # dmarket/steam-provenance). It reads SLACK_ACCESS_TOKEN and SLACK_DEFAULT_CHANNEL from context dm-release-notify.
  slack: circleci/slack@4.4.4

executors:
  node:
    docker:
      # wxt declares engines.node >= 22; vite wants ^20.19 || >=22.12. Same image family as the core
      # repo's publish job.
      - image: cimg/node:24.18
    resource_class: medium
    environment:
      REPO_SLUG: dmarket/p2p-extension

commands:
  install_deps:
    description: >
      Restore the npm cache, install from the lockfile, save the cache. `npm ci` also runs the
      `postinstall` hook (`wxt prepare`), which generates .wxt/tsconfig.json — tsconfig.json extends
      it, so nothing type-checks without this. The npm cache is cached rather than node_modules
      (161 MB, mostly small files): `npm ci` wipes node_modules anyway.
    steps:
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

  # A release-channel notice in the backend's shape (dmarket/p2p `notify`): headline, quoted commit, one context
  # line, a View Job button. `force-update.sh notice-env` writes the text (JSON-escaped) to $BASH_ENV, like the
  # backend's `extract_deploy_info`; the orb substitutes it into this body. Needs context `dm-release-notify`.
  release_notice:
    parameters:
      kind:
        description: served | expired | raised
        type: string
      script:
        description: Path to force-update.sh — `repo/scripts/…` in the jobs that clone `main` instead of checking out.
        type: string
        default: scripts/ci/force-update.sh
    steps:
      - run:
          name: Prepare the release notice
          command: bash << parameters.script >> notice-env << parameters.kind >>
      - slack/notify:
          event: pass
          custom: |
            {
              "blocks": [
                { "type": "section", "text": { "type": "mrkdwn", "text": "$NOTICE_HEADLINE" } },
                { "type": "section", "text": { "type": "mrkdwn", "text": "> $NOTICE_QUOTE" } },
                {
                  "type": "context",
                  "elements": [
                    { "type": "mrkdwn", "text": "*Author*: $NOTICE_AUTHOR" },
                    { "type": "mrkdwn", "text": "*Triggered by*: $NOTICE_TRIGGERED_BY" },
                    { "type": "mrkdwn", "text": "*Version*: $NOTICE_VERSION" },
                    { "type": "mrkdwn", "text": "*Commit*: $NOTICE_COMMIT" }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "action_id": "store_release_view_job",
                      "text": { "type": "plain_text", "text": "View Job" },
                      "url": "${CIRCLE_BUILD_URL}"
                    }
                  ]
                }
              ]
            }

jobs:
  check:
    executor: node
    steps:
      - checkout
      - install_deps
      # `when: always` on the later steps so one red run reports every failure, not just the first.
      - run:
          name: Type-check + guards (tsc, core params, surface priority, create-trade cause)
          command: npm run compile
      - run:
          name: Lint
          when: always
          command: npm run lint
      - run:
          name: Unit tests
          when: always
          command: npm test
      # No `when:` on these two, and none is needed: store steps run even when an earlier step failed,
      # which is the case they exist for. They read test-results/junit.xml, which vitest.config.ts
      # writes unconditionally — if it is ever missing, CircleCI reports "an issue with the output"
      # and the real cause is upstream (the tests never ran), not the report.
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results
          destination: test-results

  build:
    executor: node
    parameters:
      mode:
        description: WXT build mode. `production` strips the debug console; `development` includes it.
        type: enum
        enum: [production, development]
      outdir:
        description: >
          Where WXT writes this mode's build. Declared next to the mode rather than derived in shell so
          the verify step stays a one-liner. If the two ever disagree the verify step says so loudly
          (a development directory checked as production fails six ways), so this cannot drift silently.
        type: string
    steps:
      - checkout
      - install_deps
      - run:
          name: Build and zip (<< parameters.mode >>)
          # `wxt zip` builds first and then zips the output directory, so the `build:done` hook that
          # copies the ~10 MB TLSN prover (pkg/, transport/) into the output is inside the zip.
          command: npx wxt zip --mode << parameters.mode >>
      - run:
          name: Verify the artifact (<< parameters.mode >>)
          command: node scripts/verify-build.mjs << parameters.outdir >> --mode << parameters.mode >>
      - run:
          name: Collect artifacts
          command: bash scripts/ci/collect-artifacts.sh << parameters.mode >>
      - store_artifacts:
          path: artifacts
      - persist_to_workspace:
          root: .
          paths:
            - artifacts

  release:
    executor: node
    steps:
      # No install_deps: this job needs node, git and curl only. scripts/verify-build.mjs has no
      # dependencies for exactly this reason.
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Resolve the version and decide whether this is a release
          command: bash scripts/ci/release.sh resolve
      - run:
          name: Guard — CHANGELOG section and the production privilege surface
          command: bash scripts/ci/release.sh guard
      - run:
          name: Tag
          command: bash scripts/ci/release.sh tag
      - run:
          name: GitHub Release + assets
          command: bash scripts/ci/release.sh publish

  # Signs the released zip into a CRX3. No approval: this is the artifact step. Runs `npm ci`-free like
  # `release` — scripts/ci/pack-crx.mjs and verify-build.mjs have no dependencies precisely so these
  # jobs stay node + curl + coreutils, which also means no third-party code runs next to the signing
  # key HERE (the exposure is in `check`/`build-*`, which do install — see the env note in the header).
  pack_crx:
    executor: node
    steps:
      - checkout
      - run:
          name: Fetch the released package
          command: bash scripts/ci/pack-crx.sh fetch
      - run:
          name: Verify the package before signing it
          command: bash scripts/ci/pack-crx.sh verify
      - run:
          name: Sign it into a CRX3
          command: bash scripts/ci/pack-crx.sh pack
      - run:
          name: Attach the .crx to the GitHub Release
          command: bash scripts/ci/pack-crx.sh attach
      - store_artifacts:
          path: artifacts/store
      - persist_to_workspace:
          root: .
          paths:
            - artifacts/store

  # Rehearses the upload against the live store, read-only, before the real one. Same job body as the
  # upload minus the writes, so a wrong id, a service account that was never added under Developer
  # Dashboard -> Account, or a version the store would reject fails HERE, with nothing sent.
  store_preflight:
    executor: node
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Rehearse the upload (read-only — nothing is sent)
          command: bash scripts/ci/upload-to-store.sh preflight

  # Uploads that .crx to the Chrome Web Store and submits it for review, straight after a green
  # rehearsal — `hold_release` was the decision to ship. Gets the package through the workspace, so it
  # needs no GITHUB_TOKEN of its own.
  upload_to_store:
    executor: node
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Upload and submit for review
          command: bash scripts/ci/upload-to-store.sh upload

  # After a green `build-debug` on `main`: the debug zip from the workspace, uploaded over the QA autotests'
  # `latest.zip`. Node only — no `npm ci`, no context (DEBUG_BUILD_GCS_URI and P2P_EXTENSION_DEPLOY_SA_KEY are
  # project env vars). Replacing the object needs storage.objects.delete as well as create; a 403 says so.
  publish_debug_build:
    executor: node
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Upload the debug build as latest.zip (stage bucket)
          command: node scripts/ci/publish-debug-build.mjs

  # Creates the schedule that watches for this release in the store. No `checkout`: the release branch may already
  # be deleted, so the script comes from `main` (the repo is public, the clone needs no credentials).
  watch_store_release:
    executor: node
    steps:
      - run:
          name: Schedule the watch for this release
          command: git clone -q --depth 50 "https://github.com/${REPO_SLUG}.git" repo && bash repo/scripts/ci/force-update.sh watch

  # After `hold_force_update` is approved. Raises the minimum now if the store already serves the release; otherwise
  # leaves it to the watch, which reads this approval when the version is served.
  approve_force_update:
    executor: node
    steps:
      - run:
          name: Raise the minimum now if the store already serves the release
          command: git clone -q "https://github.com/${REPO_SLUG}.git" repo && bash repo/scripts/ci/force-update.sh approve
      # Reached only when it raised: otherwise the step above halts the job.
      - release_notice:
          kind: raised
          script: repo/scripts/ci/force-update.sh

  # Every 30 min from a `store-release-<version>` schedule: one GET while waiting; when served, starts the
  # `store_release` pipeline and deletes the schedule. Holds no Slack, GitHub or Cloud Storage credential.
  poll_store_release:
    executor: node
    environment:
      STORE_WATCH_VERSION: << pipeline.parameters.store_watch_version >>
      STORE_WATCH_UNTIL: << pipeline.parameters.store_watch_until >>
      RELEASE_WORKFLOW_ID: << pipeline.parameters.release_workflow_id >>
      RELEASE_LABEL: << pipeline.parameters.release_label >>
      RELEASE_SHA: << pipeline.parameters.release_sha >>
      RELEASE_ACTOR: << pipeline.parameters.release_actor >>
      SCHEDULE_ID: << pipeline.schedule.id >>
    steps:
      - checkout
      - run:
          name: Start the release notice once the store serves the version
          command: bash scripts/ci/force-update.sh poll

  notify_store_release:
    executor: node
    environment: &store_release_env
      STORE_WATCH_VERSION: << pipeline.parameters.store_watch_version >>
      STORE_WATCH_UNTIL: << pipeline.parameters.store_watch_until >>
      STORE_SERVED_VERSION: << pipeline.parameters.store_served_version >>
      FORCE_UPDATE: << pipeline.parameters.force_update >>
      RELEASE_LABEL: << pipeline.parameters.release_label >>
      RELEASE_SHA: << pipeline.parameters.release_sha >>
      RELEASE_ACTOR: << pipeline.parameters.release_actor >>
    steps:
      - checkout
      - release_notice:
          kind: << pipeline.parameters.store_release_outcome >>

  raise_min_version:
    executor: node
    environment: *store_release_env
    steps:
      - checkout
      - run:
          name: Raise web.minExtensionVersion in the prod config
          command: bash scripts/ci/force-update.sh raise
      # Reached only when it raised: an already-raised document halts the job above.
      - release_notice:
          kind: raised

  # The last job of a release: deletes the `release/vX.Y.Z` branch. Last rather than right after the
  # tag, because every job above checks the branch out — and a failed store step is retried by
  # re-running this workflow, which needs the branch to still exist.
  delete_release_branch:
    executor: node
    steps:
      - checkout
      - run:
          name: Delete the release branch
          command: bash scripts/ci/delete-release-branch.sh

workflows:
  ci:
    # The only schedules are the store watches, and the only API-started pipelines are the `store_release` ones
    # they start; running checks and both builds for those on an unchanged `main` would be pure waste.
    when:
      and:
        - not:
            equal: [scheduled_pipeline, << pipeline.trigger_source >>]
        - equal: ['', << pipeline.parameters.store_release_outcome >>]
    jobs:
      - check
      # The two builds run in parallel with EACH OTHER, but both wait for `check`.
      #
      # Not an optimisation traded away lightly — gating costs roughly a minute of wall clock per push
      # (locally, warm: compile 3s + lint 6s + test 1s against an 8s build; on CI both jobs are
      # dominated by `npm ci` and the build additionally copies the ~10 MB prover). It buys two things:
      #   - No installable artifact ever exists on a pipeline whose own checks failed. These zips exist
      #     to be handed to a human and loaded unpacked, so one that came from a red pipeline is a trap.
      #   - Specifically `check-core-params`: when that guard fails, the extension's positional config
      #     orders disagree with the installed core, and the bundle a build would produce carries a
      #     CORRUPTED config (a cookie name written into a regex slot, a trust anchor into a read
      #     definition). `verify-build.mjs` cannot catch that — it checks the manifest and the payload,
      #     not config slots — so the artifact would look perfectly valid and behave wrongly.
      - build:
          name: build-prod
          mode: production
          outdir: .output/chrome-mv3
          requires:
            - check
          context:
            - p2p-extension-ci
      - build:
          name: build-debug
          mode: development
          outdir: .output/chrome-mv3-dev
          requires:
            - check
          context:
            - p2p-extension-ci
      # The QA autotests install the newest debug build from Cloud Storage; see the header. `main` only, so a
      # feature branch never replaces what the tests run against.
      - publish_debug_build:
          requires:
            - build-debug
          filters:
            branches:
              only: main
      # Releasing is a manual act, and this is its ONLY approval. Nothing is tagged or published until
      # someone approves it, so a push to a release branch is a proposal, not a publication — but once
      # approved, the build goes all the way to the Chrome Web Store review queue without another click.
      #
      # Scoped to `release/vX.Y.Z` branches, which is what keeps this approval meaningful: it appears
      # only where releasing is the point. A push to such a branch that releases nothing anyway (the
      # tag already exists, `[skip release]`, or a snapshot core) is still safe to approve — `release`
      # prints why and goes green.
      #
      # Deliberately NOT waiting for `build-debug`: only the production build is published, so a broken
      # debug build must not block a release. `check` is transitively required through `build-prod`;
      # listed anyway so removing a build's gate cannot quietly make a release possible on a red check.
      - hold_release:
          type: approval
          requires:
            - check
            - build-prod
          filters: &release_branches
            branches:
              # `release/v1.0.1`, and a prerelease suffix is allowed (`release/v1.1.0-beta.1`).
              # scripts/ci/release.sh then requires package.json's version to be exactly this string.
              only: /^release\/v\d+(\.\d+){0,3}(-[0-9A-Za-z.-]+)?$/
      - release:
          requires:
            - hold_release
          context:
            - org-global
          filters: *release_branches
      # The store path continues in THIS workflow rather than in a second one triggered by the tag
      # `release` pushes. Two reasons, and the first is the one that shows:
      #
      #   - a tag push carries no `head_commit` in the webhook, so CircleCI labels that pipeline
      #     "Commit <sha>" instead of the commit subject — an unreadable row in the pipeline list for
      #     a pipeline we mint ourselves;
      #   - one release is then one pipeline, so the whole chain (checks → approval → tag+Release →
      #     package → preflight → store → branch cleanup) reads top to bottom in one place.
      #
      # The reason it was ever split — that an approval job inside `ci` would leave an "On Hold"
      # workflow on every push to main — is answered by the branch filter these four carry: they exist
      # only on a `release/vX.Y.Z` pipeline, and `main` sees none of them.
      #
      # What this gives up: re-running the store upload for an ALREADY released tag now means pushing
      # its release branch again rather than re-running a tag pipeline. `pack-crx.sh` is idempotent
      # (it leaves an attached .crx alone) and resolves the tag from package.json when CIRCLE_TAG is
      # absent, so that re-run is safe — it is just a longer road.
      - pack_crx:
          requires:
            - release
          context:
            - org-global
          filters: *release_branches
      - store_preflight:
          requires:
            - pack_crx
          filters: *release_branches
      - upload_to_store:
          requires:
            - store_preflight
          filters: *release_branches
      - delete_release_branch:
          requires:
            - upload_to_store
          context:
            - org-global
          filters: *release_branches
      # Every release that reached the store is watched until Chrome serves it; see STORE WATCH in the header.
      - watch_store_release:
          requires:
            - upload_to_store
          filters: *release_branches
      # Optional: approve only for a release every seller must move to. The ONLY place a release is forced — the
      # deferred pipelines read this approval's state. After `upload_to_store`, because forcing a version that was
      # never submitted means nothing.
      - hold_force_update:
          type: approval
          requires:
            - upload_to_store
          filters: *release_branches
      - approve_force_update:
          requires:
            - hold_force_update
          context:
            - org-global
            - dm-release-notify
          filters: *release_branches

  store_watch:
    when:
      and:
        - equal: [scheduled_pipeline, << pipeline.trigger_source >>]
        - not:
            equal: ['', << pipeline.parameters.store_watch_version >>]
    jobs:
      - poll_store_release

  # Started by `poll_store_release` through the API once the store serves the release (or the watch expired).
  store_release:
    when:
      not:
        equal: ['', << pipeline.parameters.store_release_outcome >>]
    jobs:
      - notify_store_release:
          context:
            - dm-release-notify

  # Same pipeline, in parallel with the notice: the forced-update raise. A separate workflow because CircleCI has
  # no per-job condition — `force_update` is what `poll_store_release` read from `hold_force_update`.
  store_release_forced:
    when:
      and:
        - equal: [served, << pipeline.parameters.store_release_outcome >>]
        - << pipeline.parameters.force_update >>
    jobs:
      - raise_min_version:
          context:
            - org-global
            - dm-release-notify
